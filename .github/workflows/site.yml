name: Update arXiv and publish
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths-ignore: ["README.md"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research metadata
        run: python scripts/test_data.py
      - name: Fetch arXiv metadata (scheduled/manual only)
        if: github.event_name != 'push'
        run: |
          python scripts/update_arxiv.py
          python scripts/test_data.py
      - name: Persist new metadata
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- src/data/papers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/papers.json
            git commit -m "data: refresh arXiv archive"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Astro static site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
