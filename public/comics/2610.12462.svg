<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="The Lopsided Disk: original editorial science comic"><rect width="1200" height="770" fill="#fff"/><style>.letter{font-family:'Comic Sans MS','Trebuchet MS',sans-serif;fill:#111;font-weight:500}svg{font-family:'Comic Sans MS','Trebuchet MS',sans-serif}</style><text x="600" y="66" text-anchor="middle" font-size="44" class="letter"><tspan x="600" dy="0">The Lopsided Disk</tspan></text><text x="600" y="104" text-anchor="middle" font-size="18" class="letter"><tspan x="600" dy="0">Secunda, Jiang &amp; Greene 2026 · arXiv:2610.12462</tspan></text><g transform="translate(18,165)"><rect x="0" y="0" width="376" height="495" fill="#fff" stroke="#111" stroke-width="3"/><rect x="15" y="15" width="344" height="107" rx="19" fill="#fff" stroke="#161616" stroke-width="3"/><path d="M50 122 l-13 18 5 -18" fill="#fff" stroke="#161616" stroke-width="2.5"/><text x="187" y="44" text-anchor="middle" font-size="18" class="letter"><tspan x="187" dy="0">X-rays flash.</tspan><tspan x="187" dy="23.400000000000002">The flat disk replies!</tspan></text><g stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="61" cy="328" r="20"/><path d="M61 348 v82 m0 -42 l-27 44 m27 -44 l29 44 m-29 -69 l-30 21 m30 -21 l30 20"/></g><g fill="#111"><circle cx="54" cy="324" r="2.4"/><circle cx="68" cy="324" r="2.4"/></g><path d="M52 335 Q61 345 70 335" fill="none" stroke="#111" stroke-width="2.5"/><ellipse cx="239" cy="327" rx="99" ry="30" fill="none" stroke="#111" stroke-width="3"/><ellipse cx="239" cy="327" rx="67" ry="18" fill="none" stroke="#111" stroke-width="2"/><circle cx="239" cy="327" r="19"/><text x="220" y="438" text-anchor="middle" font-size="17" class="letter"><tspan x="220" dy="0">Short UV/optical lag</tspan></text></g><g transform="translate(412,165)"><rect x="0" y="0" width="376" height="495" fill="#fff" stroke="#111" stroke-width="3"/><rect x="15" y="15" width="344" height="108" rx="19" fill="#fff" stroke="#161616" stroke-width="3"/><path d="M50 123 l-13 18 5 -18" fill="#fff" stroke="#161616" stroke-width="2.5"/><text x="187" y="44" text-anchor="middle" font-size="18" class="letter"><tspan x="187" dy="0">What if one side</tspan><tspan x="187" dy="23.400000000000002">is much thicker?</tspan></text><g stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="56" cy="326" r="20"/><path d="M56 346 v82 m0 -42 l-27 44 m27 -44 l29 44 m-29 -69 l-30 21 m30 -21 l30 20"/></g><g fill="#111"><circle cx="49" cy="322" r="2.4"/><circle cx="63" cy="322" r="2.4"/></g><path d="M49 335 h14" stroke="#111" stroke-width="2.5"/><path d="M136 330 Q194 276 230 321 Q278 173 342 306 Q343 357 258 361 L150 353 Z" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="216" cy="322" r="17"/><text x="226" y="420" text-anchor="middle" font-size="17" class="letter"><tspan x="226" dy="0">Absorption + turbulence</tspan></text></g><g transform="translate(806,165)"><rect x="0" y="0" width="376" height="495" fill="#fff" stroke="#111" stroke-width="3"/><rect x="15" y="15" width="344" height="107" rx="19" fill="#fff" stroke="#161616" stroke-width="3"/><path d="M50 122 l-13 18 5 -18" fill="#fff" stroke="#161616" stroke-width="2.5"/><text x="187" y="44" text-anchor="middle" font-size="18" class="letter"><tspan x="187" dy="0">Maybe the long lag</tspan><tspan x="187" dy="23.400000000000002">is NOT a giant disk.</tspan></text><g stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="59" cy="329" r="20"/><path d="M59 349 v82 m0 -42 l-27 44 m27 -44 l29 44 m-29 -69 l-30 21 m30 -21 l30 20"/></g><g fill="#111"><circle cx="52" cy="325" r="2.4"/><circle cx="66" cy="325" r="2.4"/></g><path d="M50 336 Q59 346 68 336" fill="none" stroke="#111" stroke-width="2.5"/><rect x="109" y="234" width="221" height="165" fill="#fff" stroke="#111" stroke-width="3"/><text x="216" y="260" text-anchor="middle" font-size="17" class="letter"><tspan x="216" dy="0">Light curves</tspan></text><path d="M125 298 Q158 272 183 297 T232 296 Q265 330 313 299" stroke="#111" fill="none" stroke-width="3"/><path d="M125 351 Q175 352 217 339 T310 345" stroke="#111" stroke-width="3" stroke-dasharray="8 5" fill="none"/><text x="215" y="438" text-anchor="middle" font-size="18" class="letter"><tspan x="215" dy="0">3–5× longer lag</tspan></text></g><text x="600" y="715" text-anchor="middle" font-size="21" class="letter"><tspan x="600" dy="0">Even light can take the scenic route through a lopsided disk.</tspan></text></svg>