<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="Don't Blame Everything on Dust: original editorial science comic"><rect width="1200" height="770" fill="#fff"/><style>.letter{font-family:'Comic Sans MS','Trebuchet MS',sans-serif;fill:#111;font-weight:500}svg{font-family:'Comic Sans MS','Trebuchet MS',sans-serif}</style><text x="600" y="66" text-anchor="middle" font-size="44" class="letter"><tspan x="600" dy="0">Don't Blame Everything on Dust</tspan></text><text x="600" y="104" text-anchor="middle" font-size="18" class="letter"><tspan x="600" dy="0">Dehghanian et al. 2026 · arXiv:2610.12715</tspan></text><g transform="translate(18,165)"><rect x="0" y="0" width="376" height="495" fill="#fff" stroke="#111" stroke-width="3"/><rect x="13" y="15" width="347" height="110" rx="19" fill="#fff" stroke="#161616" stroke-width="3"/><path d="M48 125 l-13 18 5 -18" fill="#fff" stroke="#161616" stroke-width="2.5"/><text x="186.5" y="44" text-anchor="middle" font-size="18" class="letter"><tspan x="186.5" dy="0">The Balmer decrement</tspan><tspan x="186.5" dy="23.400000000000002">changed. Must be dust!</tspan></text><g stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="58" cy="324" r="20"/><path d="M58 344 v82 m0 -42 l-27 44 m27 -44 l29 44 m-29 -69 l-30 21 m30 -21 l30 20"/></g><g fill="#111"><circle cx="51" cy="320" r="2.4"/><circle cx="65" cy="320" r="2.4"/></g><path d="M49 331 Q58 341 67 331" fill="none" stroke="#111" stroke-width="2.5"/><rect x="120" y="248" width="224" height="154" stroke="#111" stroke-width="3" fill="#fff"/><text x="232" y="287" text-anchor="middle" font-size="20" class="letter"><tspan x="232" dy="0">Hα / Hβ = changed</tspan><tspan x="232" dy="26">Hγ / Hβ = changed</tspan><tspan x="232" dy="26">Dust?</tspan></text></g><g transform="translate(412,165)"><rect x="0" y="0" width="376" height="495" fill="#fff" stroke="#111" stroke-width="3"/><rect x="13" y="15" width="347" height="112" rx="19" fill="#fff" stroke="#161616" stroke-width="3"/><path d="M48 127 l-13 18 5 -18" fill="#fff" stroke="#161616" stroke-width="2.5"/><text x="186.5" y="44" text-anchor="middle" font-size="18" class="letter"><tspan x="186.5" dy="0">Or maybe hydrogen</tspan><tspan x="186.5" dy="23.400000000000002">got extra soft light.</tspan></text><g stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="64" cy="328" r="20"/><path d="M64 348 v82 m0 -42 l-27 44 m27 -44 l29 44 m-29 -69 l-30 21 m30 -21 l30 20"/></g><g fill="#111"><circle cx="57" cy="324" r="2.4"/><circle cx="71" cy="324" r="2.4"/></g><path d="M55 335 Q64 345 73 335" fill="none" stroke="#111" stroke-width="2.5"/><circle cx="230" cy="322" r="65" fill="none" stroke="#111" stroke-width="2"/><circle cx="230" cy="322" r="27" fill="none" stroke="#111" stroke-width="3"/><circle cx="230" cy="322" r="6" fill="#111"/><circle cx="285" cy="288" r="7" fill="#111"/><text x="226" y="433" text-anchor="middle" font-size="17" class="letter"><tspan x="226" dy="0">Excitation, not just dust</tspan></text></g><g transform="translate(806,165)"><rect x="0" y="0" width="376" height="495" fill="#fff" stroke="#111" stroke-width="3"/><rect x="13" y="15" width="347" height="112" rx="19" fill="#fff" stroke="#161616" stroke-width="3"/><path d="M48 127 l-13 18 5 -18" fill="#fff" stroke="#161616" stroke-width="2.5"/><text x="186.5" y="44" text-anchor="middle" font-size="18" class="letter"><tspan x="186.5" dy="0">Same Balmer changes;</tspan><tspan x="186.5" dy="23.400000000000002">different physics.</tspan></text><g stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="51" cy="329" r="20"/><path d="M51 349 v82 m0 -42 l-27 44 m27 -44 l29 44 m-29 -69 l-30 21 m30 -21 l30 20"/></g><g fill="#111"><circle cx="44" cy="325" r="2.4"/><circle cx="58" cy="325" r="2.4"/></g><path d="M44 338 h14" stroke="#111" stroke-width="2.5"/><path d="M117 390 V233 M117 390 H342" stroke="#111" stroke-width="3" fill="none"/><path d="M121 386 L280 255 M121 386 Q217 372 315 327" stroke="#111" stroke-width="3" fill="none"/><text x="227" y="277" text-anchor="middle" font-size="16" class="letter"><tspan x="227" dy="0">Dust</tspan></text><text x="239" y="356" text-anchor="middle" font-size="15" class="letter"><tspan x="239" dy="0">Extra radiation</tspan></text></g><text x="600" y="715" text-anchor="middle" font-size="21" class="letter"><tspan x="600" dy="0">When hydrogen changes its tune, dust is not the only suspect.</tspan></text></svg>